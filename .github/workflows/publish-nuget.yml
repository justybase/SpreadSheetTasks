name: publish-nuget

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build, test & publish to nuget.org
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore source/SpreadSheetTasks.slnx

      - name: Build (Release)
        run: dotnet build source/SpreadSheetTasks.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test source/Tests/Tests.csproj -c Release --no-build --nologo

      - name: Publish NativeAOT smoke test
        run: dotnet publish source/AotSmoke/AotSmoke.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -o artifacts/aot-smoke --nologo

      - name: Run NativeAOT smoke test
        run: |
          & .\artifacts\aot-smoke\AotSmoke.exe

      - name: Pack
        run: dotnet pack source/SpreadSheetTasks/SpreadSheetTasks.csproj -c Release --no-build -o artifacts --nologo

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        shell: bash
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
